<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marble Run</title>
  <style>
    :root {
      --panel: rgba(30, 32, 38, 0.82);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e8e6e1;
      --muted: #a8a49c;
      --accent: #f2b544;
      --accent-text: #2a2418;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22;
                 font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text);
                 user-select: none; -webkit-user-select: none; overscroll-behavior: none; touch-action: none; }
    input, textarea { user-select: text; -webkit-user-select: text; }
    canvas, img { -webkit-user-drag: none; user-drag: none; }
    [hidden] { display: none !important; }
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--accent); }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    button { font: inherit; }

    #hud { position: fixed; left: 12px; bottom: 12px; color: var(--text); font-size: 12px; line-height: 1.6;
           background: var(--panel); border: 1px solid var(--panel-border); padding: 8px 12px; border-radius: 8px;
           pointer-events: none; white-space: pre; backdrop-filter: blur(6px); }

    #toolbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px;
               background: var(--panel); border: 1px solid var(--panel-border); padding: 6px 8px; border-radius: 10px;
               backdrop-filter: blur(6px); }
    #toolbar .group { display: flex; align-items: center; gap: 4px; padding: 0 6px; border-right: 1px solid var(--panel-border); }
    #toolbar .group:last-child { border-right: none; }
    #toolbar button { background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 6px;
                      padding: 5px 10px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    #toolbar button:hover { background: rgba(255,255,255,0.08); }
    #toolbar button:disabled { color: var(--muted); opacity: 0.5; cursor: default; background: transparent; }
    #toolbar button.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    #toolbar button.danger:hover { background: rgba(224, 87, 79, 0.35); }
    #toolbar .label { min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; }
    #toolbar .group.dim { opacity: 0.45; }
    #toolbar .group.disabled { opacity: 0.4; pointer-events: none; }

    #picked-panel { position: fixed; transform: translate(-50%, -100%); display: flex; gap: 4px; padding: 4px;
                    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; backdrop-filter: blur(6px); }
    #picked-panel button { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid transparent; border-radius: 6px;
                           padding: 4px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    #picked-panel button:hover { background: rgba(255,255,255,0.14); }
    #picked-panel button.danger:hover { background: rgba(224, 87, 79, 0.4); }
    #picked-panel[data-tool-mode="chain"] .free-only { display: none; }

    #playbar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px 8px;
               background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; backdrop-filter: blur(6px); }
    #playbar button { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid transparent; border-radius: 6px;
                      padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    #playbar button:hover { background: rgba(255,255,255,0.12); }
    #playbar button.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    #playbar button.primary { background: rgba(62, 196, 109, 0.25); }
    #playbar button.primary:hover { background: rgba(62, 196, 109, 0.45); }
    #playbar kbd { font: 10px/1 ui-monospace, monospace; opacity: 0.6; margin-left: 4px; }
    #playbar .shape { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; font-size: 13px; color: var(--muted); white-space: nowrap;
                      border-left: 1px solid var(--panel-border); margin-left: 4px; }
    #playbar select { font: inherit; color: var(--text); background: rgba(255,255,255,0.08); border: 1px solid var(--panel-border);
                      border-radius: 6px; padding: 4px 6px; }
    #playbar select option { color: #222; }

    #race { position: fixed; top: 64px; right: 12px; width: 190px; padding: 10px 12px; background: var(--panel);
            border: 1px solid var(--panel-border); border-radius: 10px; backdrop-filter: blur(6px); font-size: 13px; }
    #race h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
    #race .clock { font-variant-numeric: tabular-nums; color: var(--text); }
    #race ol { margin: 0; padding: 0; list-style: none; max-height: 40vh; overflow-y: auto; scrollbar-width: thin; }
    #race li { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-variant-numeric: tabular-nums; }
    #race li .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset -2px -2px 3px rgba(0,0,0,.35); flex: none; }
    #race li .rank { width: 2ch; color: var(--muted); }
    #race li .time { margin-left: auto; }
    #race .empty { color: var(--muted); }

    #palette { position: fixed; top: 64px; left: 12px; bottom: 96px; width: 104px; overflow-y: auto; display: flex;
               flex-direction: column; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--panel-border);
               border-radius: 10px; backdrop-filter: blur(6px); scrollbar-width: thin; }
    #palette.disabled { opacity: 0.4; pointer-events: none; }
    #palette .piece { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px;
                      background: rgba(255,255,255,0.04); color: var(--text); border: 1px solid transparent; border-radius: 8px;
                      cursor: pointer; font-size: 12px; }
    #palette .piece:hover { background: rgba(255,255,255,0.1); }
    #palette .piece.active { border-color: var(--accent); background: rgba(242, 181, 68, 0.18); }
    #palette .piece { position: relative; }
    #palette .piece canvas { width: 72px; height: 72px; border-radius: 6px; background: rgba(159, 197, 232, 0.35); }
    #palette .piece kbd { position: absolute; top: 8px; left: 8px; font: 11px/1 ui-monospace, monospace; color: var(--accent-text);
                          background: var(--accent); border-radius: 4px; padding: 2px 4px; opacity: 0.9; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="hud"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
