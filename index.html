<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marble Run</title>
  <style>
    :root {
      --panel: rgba(30, 32, 38, 0.82);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e8e6e1;
      --muted: #a8a49c;
      --accent: #f2b544;
      --accent-text: #2a2418;
      /* Edge fades for a bar that scrolls sideways - see #variants below. */
      --fade-right: linear-gradient(to right, #000 calc(100% - 30px), transparent);
      --fade-left: linear-gradient(to right, transparent, #000 30px);
      --fade-both: linear-gradient(to right, transparent, #000 30px calc(100% - 30px), transparent);
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22;
                 font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text);
                 user-select: none; -webkit-user-select: none; overscroll-behavior: none; touch-action: none; }
    input, textarea { user-select: text; -webkit-user-select: text; }
    canvas, img { -webkit-user-drag: none; user-drag: none; }
    [hidden] { display: none !important; }
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--accent); }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    button { font: inherit; }

    /* #hud is a sibling of #ui and comes after it, so without a z-index it paints over every
       control in #ui - and being pointer-events:none it hid the picked-piece panel's buttons
       while leaving them tappable. The HUD is a readout, so it belongs under the controls. */
    #hud { position: fixed; left: 12px; bottom: 12px; z-index: 1; color: var(--text); font-size: 12px; line-height: 1.6;
           background: var(--panel); border: 1px solid var(--panel-border); padding: 8px 12px; border-radius: 8px;
           pointer-events: none; white-space: pre; backdrop-filter: blur(6px); }

    #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px; background: #1b1d22; color: var(--muted); }
    #boot p { margin: 0; font-size: 15px; color: var(--text); }
    #boot small { font-size: 12px; }
    #boot.failed .spinner { animation: none; border-color: rgba(224, 87, 79, 0.5); border-top-color: #e0574f; }
    #boot .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.14);
                     border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toolbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 2; display: flex; gap: 10px;
               background: var(--panel); border: 1px solid var(--panel-border); padding: 6px 8px; border-radius: 10px;
               backdrop-filter: blur(6px); }
    #toolbar .group { display: flex; align-items: center; gap: 4px; padding: 0 6px; border-right: 1px solid var(--panel-border); }
    #toolbar .group:last-child { border-right: none; }
    #toolbar button { background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 6px;
                      padding: 5px 10px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    #toolbar button:hover { background: rgba(255,255,255,0.08); }
    #toolbar button:disabled { color: var(--muted); opacity: 0.5; cursor: default; background: transparent; }
    #toolbar button.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    #toolbar button.danger:hover { background: rgba(224, 87, 79, 0.35); }
    #toolbar select { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--panel-border);
                      border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 13px; font-family: inherit; }
    #toolbar select:hover { background: rgba(255,255,255,0.12); }
    #toolbar select option { background: #22262c; color: var(--text); }
    #toolbar .label { min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; }
    #toolbar .group.dim { opacity: 0.45; }
    #toolbar .group.disabled { opacity: 0.4; pointer-events: none; }

    #picked-panel { position: fixed; transform: translate(-50%, -100%); z-index: 3; display: flex; gap: 4px; padding: 4px;
                    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; backdrop-filter: blur(6px); }
    #picked-panel button { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid transparent; border-radius: 6px;
                           padding: 4px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    #picked-panel button:hover { background: rgba(255,255,255,0.14); }
    #picked-panel button.danger:hover { background: rgba(224, 87, 79, 0.4); }
    #picked-panel[data-tool-mode="chain"] .free-only { display: none; }

    #playbar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 2; display: flex; gap: 4px; padding: 6px 8px;
               background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; backdrop-filter: blur(6px); }
    #playbar button { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid transparent; border-radius: 6px;
                      padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    #playbar button:hover { background: rgba(255,255,255,0.12); }
    #playbar button.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    #playbar button.primary { background: rgba(62, 196, 109, 0.25); }
    #playbar button.primary:hover { background: rgba(62, 196, 109, 0.45); }
    #playbar kbd { font: 10px/1 ui-monospace, monospace; opacity: 0.6; margin-left: 4px; }
    #playbar .shape { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; font-size: 13px; color: var(--muted); white-space: nowrap;
                      border-left: 1px solid var(--panel-border); margin-left: 4px; }
    #playbar select { font: inherit; color: var(--text); background: rgba(255,255,255,0.08); border: 1px solid var(--panel-border);
                      border-radius: 6px; padding: 4px 6px; }
    #playbar select option { color: #222; }

    #race { position: fixed; top: 64px; right: 12px; z-index: 2; width: 190px; padding: 10px 12px; background: var(--panel);
            border: 1px solid var(--panel-border); border-radius: 10px; backdrop-filter: blur(6px); font-size: 13px; }
    #race h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
    #race .clock { font-variant-numeric: tabular-nums; color: var(--text); }
    #race ol { margin: 0; padding: 0; list-style: none; max-height: 40vh; overflow-y: auto; scrollbar-width: thin; }
    #race li { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-variant-numeric: tabular-nums; }
    #race li .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset -2px -2px 3px rgba(0,0,0,.35); flex: none; }
    #race li .rank { width: 2ch; color: var(--muted); }
    #race li .time { margin-left: auto; }
    #race .empty { color: var(--muted); }

    /* border-box, or the 20px of padding and the 1px border are added on top of the width and
       the "calc(100vw - 32px)" fallback renders 42px wider than the screen - at 412px it came
       out 422px wide starting at x = -5, hanging off both edges. 802px keeps the desktop size
       exactly where it was (760 of content + 40 padding + 2 border). */
    #help { position: fixed; inset: 50% auto auto 50%; transform: translate(-50%, -50%); z-index: 20;
            box-sizing: border-box;
            width: min(802px, calc(100vw - 32px)); max-height: calc(100vh - 80px); overflow-y: auto;
            padding: 4px 20px 18px; background: var(--panel); border: 1px solid var(--panel-border);
            border-radius: 12px; backdrop-filter: blur(10px); box-shadow: 0 18px 50px rgba(0,0,0,0.45);
            scrollbar-width: thin; }
    #help h3 { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0;
               margin: 0 -20px 12px; padding: 14px 20px 10px; font-size: 15px; background: var(--panel);
               border-bottom: 1px solid var(--panel-border); }
    #help h3 button { background: rgba(255,255,255,0.06); color: var(--text); border: none; border-radius: 6px;
                      padding: 3px 9px; cursor: pointer; font-size: 13px; }
    #help h3 button:hover { background: rgba(255,255,255,0.16); }
    #help .cols { display: flex; gap: 28px; flex-wrap: wrap; }
    #help section { flex: 1 1 300px; min-width: 260px; }
    #help h4 { margin: 14px 0 6px; font-size: 13px; color: var(--accent); font-weight: 600; }
    #help h4:first-child { margin-top: 0; }
    #help .tag { margin-left: 8px; color: var(--muted); font-weight: 400; font-size: 11px; }
    #help dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: 13px; }
    #help dt { color: var(--text); white-space: nowrap; }
    #help dd { margin: 0; color: var(--muted); }
    #help p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
    #help kbd { font: 11px/1.6 ui-monospace, monospace; background: rgba(255,255,255,0.1);
                border: 1px solid var(--panel-border); border-radius: 4px; padding: 1px 5px; }

    #variants { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 2; display: flex; align-items: center; gap: 4px;
      padding: 4px 8px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; font-size: 13px; }
    #variants .name { color: var(--muted); margin-right: 4px; white-space: nowrap; }
    /* The buttons live in a span, so they wrap unless it is a row of its own - eight lift
       variants turned the bar into a 142px block on a phone. */
    #variants .buttons { display: flex; flex-wrap: nowrap; gap: 4px; }
    #variants .buttons button { flex: 0 0 auto; }
    #variants button { background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
    #variants button:hover { background: rgba(255,255,255,0.08); }
    #variants button.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
    #palette { position: fixed; top: 64px; left: 12px; bottom: 96px; z-index: 2; width: 104px; overflow-y: auto; display: flex;
               flex-direction: column; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--panel-border);
               border-radius: 10px; backdrop-filter: blur(6px); scrollbar-width: thin; }
    #palette.disabled { opacity: 0.4; pointer-events: none; }
    #palette .piece { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px;
                      background: rgba(255,255,255,0.04); color: var(--text); border: 1px solid transparent; border-radius: 8px;
                      cursor: pointer; font-size: 12px; }
    #palette .piece:hover { background: rgba(255,255,255,0.1); }
    #palette .piece.active { border-color: var(--accent); background: rgba(242, 181, 68, 0.18); }
    #palette .piece { position: relative; }
    #palette .piece canvas { width: 72px; height: 72px; border-radius: 6px; background: rgba(159, 197, 232, 0.35); }
    #palette .piece kbd { position: absolute; top: 8px; left: 8px; font: 11px/1 ui-monospace, monospace; color: var(--accent-text);
                          background: var(--accent); border-radius: 4px; padding: 2px 4px; opacity: 0.9; }

    /* ---------------------------------------------------------------- touch */
    /* Fingers need bigger targets, and a key chip printed on a button you tap is dead weight. */
    @media (pointer: coarse) {
      #toolbar button, #toolbar select { padding: 9px 12px; font-size: 14px; }
      #playbar button { padding: 10px 14px; font-size: 14px; }
      #picked-panel button { padding: 8px 13px; font-size: 13px; }
      #variants button { padding: 7px 12px; }
      /* Only the chips ON controls. A blanket "kbd" also emptied every <dt> in the help list,
         which left the descriptions with nothing beside them - and a phone can have a keyboard
         plugged into it, so the help is exactly where the shortcuts should still be readable. */
      #playbar kbd, #palette kbd { display: none !important; }
    }

    /* Tablet-sized touch screens keep the centred desktop bars, but touch padding makes those
       bars big enough to run into the corner panels: at 820x1180 the play bar was 684px wide
       and overlapped the bottom-left HUD by 126px, and the toolbar clipped the top of #race and
       #palette by 3px. Pointer-coarse only, so the desktop layout is untouched. */
    @media (pointer: coarse) and (min-width: 761px) {
      #race, #palette { top: calc(var(--toolbar-h, 43px) + 21px); }
      #variants { top: calc(var(--toolbar-h, 43px) + 17px); }
      /* --playbar-h is 0px whenever the bar is down, so edit mode keeps its 12px. */
      #hud { bottom: calc(var(--playbar-h, 0px) + 12px); }
    }

    /* Phone layout. The bars are centred and as wide as they like on a desktop, which puts half
       of each one off both edges of a 412px screen - including the edit/play switch. Here they
       span the screen and scroll sideways instead; touch-action has to allow that, since the
       body blocks default gestures so a drag rotates the camera. */
    /* Phone-only chrome; the media query below turns them on. */
    #more-group, #palette-toggle { display: none; }

    @media (max-width: 760px) {
      /* The toolbar does not scroll sideways any more: 20-odd controls came to three screens of
         it, so the level buttons - which you need on almost every piece - were off screen and
         invisible. What is left in the first row is what building actually needs; the rest folds
         out below on "...". */
      #toolbar { left: 6px; right: 6px; transform: none; max-width: none; top: 6px; flex-wrap: wrap; }
      #toolbar .group { flex: 0 0 auto; }
      #toolbar .group.phone-more { display: none; }
      #toolbar.expanded .group.phone-more { display: flex; }
      #toolbar.expanded { padding-bottom: 8px; }
      #more-group { display: flex; margin-left: auto; }
      #toolbar #demo-select { max-width: 42vw; }

      /* Wrapped, not scrolled. One row came to 682px of content in a 398px box, so 暂停 / 音效 /
         弹珠 were off the right (跟随 too at 360px) - and the scrollbar was hidden, so nothing
         said they were there. Two short rows fit the lot with no scrolling at all. */
      #playbar { left: 6px; right: 6px; transform: none; max-width: none; bottom: 6px;
                 flex-wrap: wrap; row-gap: 4px; overflow-x: hidden; touch-action: pan-y; }
      #palette::-webkit-scrollbar { display: none; }
      #playbar > * { flex: 0 0 auto; }

      /* The palette wraps into a grid instead of scrolling sideways. A single row meant 4.3
         screens of horizontal scrolling to reach the 23rd piece with five visible at a time;
         wrapped, they are all within one short vertical scroll and you can see what you are
         choosing from. */
      /* border-box, or max-height caps the CONTENT and the 12px of padding plus 2px of border
         come out on top: the collapsed bar measured 98px against the 84px the toggle button is
         positioned from, so the toggle sat 8px inside the palette. */
      #palette { top: auto; bottom: 6px; left: 6px; right: 6px; width: auto; padding: 6px; gap: 6px;
                 box-sizing: border-box;
                 flex-direction: row; flex-wrap: wrap; justify-content: flex-start;
                 max-height: 38vh; overflow-x: hidden; overflow-y: auto;
                 scrollbar-width: none; touch-action: pan-y; }
      #palette .piece { flex: 0 0 auto; width: 70px; padding: 4px 3px; font-size: 11px; }
      #palette .piece canvas { width: 58px; height: 58px; }
      /* Collapsed to one row until you need it, so it does not sit on half the track. */
      #palette:not(.open) { max-height: 84px; overflow: hidden; }
      #palette-toggle { display: block; position: fixed; right: 10px; z-index: 12; bottom: calc(6px + 84px + 6px);
                        background: var(--panel); color: var(--text); border: 1px solid var(--panel-border);
                        border-radius: 8px; padding: 7px 12px; font-size: 13px; backdrop-filter: blur(6px); }
      #palette.open ~ #palette-toggle { bottom: calc(38vh + 12px); }

      /* Stacked under the toolbar, which is not a fixed height here: it wraps to two rows and
         grows again when "..." is open, so these follow the measured height (see panel.ts). */
      #hud { top: calc(var(--toolbar-h, 56px) + 12px); bottom: auto; left: 6px; right: 6px;
             font-size: 11px; white-space: pre-wrap; }
      /* The play bar is two rows here and its height moves with the text, so follow it. */
      #race { top: auto; bottom: calc(var(--playbar-h, 63px) + 6px); right: 6px; width: 150px; font-size: 12px; }
      #race ol { max-height: 26vh; }
      /* One scrolling row under the HUD, not a 142px block down at the thumb: the lift alone has
         eight variants, and the bottom of the screen already belongs to the palette. */
      #variants { top: calc(var(--toolbar-h, 56px) + var(--hud-h, 40px) + 18px); bottom: auto;
                  left: 6px; right: 6px; transform: none;
                  overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
      #variants::-webkit-scrollbar { display: none; }
      /* A row that scrolls sideways looks exactly like one that does not - the lift's eight
         variants ran 321px past the right edge of a 412px screen with nothing to say so.
         panel.ts marks which end still has content behind it; fade that end away. */
      #variants[data-scroll="start"] { -webkit-mask-image: var(--fade-right); mask-image: var(--fade-right); }
      #variants[data-scroll="mid"] { -webkit-mask-image: var(--fade-both); mask-image: var(--fade-both); }
      #variants[data-scroll="end"] { -webkit-mask-image: var(--fade-left); mask-image: var(--fade-left); }
      #help { touch-action: pan-y; }
      /* Never let the floating panel for a selected piece hang off the edge. */
      #picked-panel { max-width: calc(100vw - 12px); }
    }
  </style>
</head>
<body>
  <!-- Static, so it paints before any script runs. The physics engine is a megabyte of gzipped
       WASM and has to arrive before anything can be shown; without this the page is blank until
       it does. main.ts removes it, or fills in the error if boot fails. -->
  <div id="boot">
    <div class="spinner"></div>
    <p>加载中…</p>
    <small>第一次打开要下载物理引擎，约 1 MB</small>
  </div>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="hud"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
